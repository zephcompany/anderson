name: Forcar atualização dos assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-bust-assets.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Adicionar versão aos assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          version = 'v=20260907-0247'
          s = re.sub(r'(assets/[A-Za-z0-9._-]+\.(?:png|jpg|jpeg|webp|svg))(?:\?v=[^\"\'\s<]*)?', lambda m: m.group(1) + '?' + version, s)
          p.write_text(s, encoding='utf-8')
          Path('.nojekyll').touch()
          PY

      - name: Commitar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git diff --cached --quiet || git commit -m "Força recarregamento dos assets no Pages"
          git push
