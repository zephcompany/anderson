name: Melhorias premium

on:
  workflow_dispatch:
  push:
    paths:
      - 'patch_site.py'
      - 'enhancements.css'
      - 'enhancements.js'
      - '.github/workflows/enhance-interactions.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar patch
        run: python3 patch_site.py

      - name: Commitar alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Aplica interacoes premium no site"
          git push
