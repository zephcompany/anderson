name: Baixar assets do Figma

on:
  push:
    paths:
      - '.github/workflows/fetch-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baixar-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Baixar imagens do Figma
        run: bash baixar-assets.sh

      - name: Commitar assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Nenhum asset novo para commit."
          else
            git commit -m "Adiciona assets exportados do Figma"
            git push
          fi
