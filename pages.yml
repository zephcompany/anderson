name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Conferir se os assets foram commitados
        run: |
          total=$(find assets -type f \( -name '*.png' -o -name '*.svg' -o -name '*.jpg' -o -name '*.webp' \) | wc -l)
          echo "Imagens encontradas em assets/: $total"
          if [ "$total" -lt 20 ]; then
            echo "::warning::Faltam imagens em assets/. Rode 'bash baixar-assets.sh' e commite a pasta, senão o site sobe sem foto."
          fi

      - name: Preparar
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4
