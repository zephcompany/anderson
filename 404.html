<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Anderson Zawa</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
    background:#000;color:#fff;font-family:'Outfit',system-ui,sans-serif;
    background-image:
      linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:120px 120px;
  }
  main{text-align:center;max-width:520px}
  h1{
    margin:0;font-weight:400;line-height:1.06;letter-spacing:-.01em;
    font-size:clamp(2.4rem,7vw,4rem);
  }
  h1 em{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:1.1em}
  p{margin:20px 0 0;font-size:1.05rem;line-height:1.55;color:rgba(255,255,255,.5)}
  a{
    display:inline-flex;align-items:center;justify-content:center;
    margin-top:36px;height:60px;padding:0 34px;border-radius:14px;
    background:linear-gradient(144deg,#fff 0%,#a7a7a7 45%,#3b3b3b 100%);
    color:#000;font-weight:600;text-decoration:none;
    transition:transform .35s cubic-bezier(.22,.61,.36,1),box-shadow .35s;
  }
  a:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(255,255,255,.16)}
  a:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
</head>
<body>
  <main>
    <h1>Essa página não <em>existe.</em></h1>
    <p>O endereço mudou ou nunca esteve aqui. Volte para o início e siga a partir dos projetos.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
